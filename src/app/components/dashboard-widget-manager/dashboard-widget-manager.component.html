<!-- Floating Action Button -->
<button class="fab" *ngIf="permissions.canShowDrawer" (click)="openDrawer()" title="Dashboard Actions">
  <span class="material-icons">chevron_left</span>
</button>

<!-- Drawer Overlay -->
<div class="drawer-overlay" *ngIf="permissions.canShowDrawer" [class.open]="drawerOpen" (click)="closeDrawer()"></div>

<!-- Drawer -->
<div class="drawer" *ngIf="permissions.canShowDrawer" [class.open]="drawerOpen">
  <div class="drawer-header">
    <h3>Dashboard Actions</h3>
    <button class="close-btn" (click)="closeDrawer()" title="Close">
      <span class="material-icons">close</span>
    </button>
  </div>
  
  <div class="drawer-content">
    <div class="drawer-section" *ngIf="permissions.canManageLayout">
      <h4>Layout Actions</h4>
      <div class="layout-actions-row">
        <button class="drawer-action-btn compact" (click)="deleteAllWidgets()" title="Delete All Widgets">
          <span class="material-icons">delete_sweep</span>
        </button>
        
        <button class="drawer-action-btn compact" (click)="saveLayout()" title="Save Layout">
          <span class="material-icons">save</span>
        </button>
        
        <button class="drawer-action-btn compact" (click)="resetLayout()" title="Reset Layout">
          <span class="material-icons">refresh</span>
        </button>
      </div>
    </div>
    
    <div class="drawer-divider" *ngIf="permissions.canManageLayout && permissions.canAddWidgets"></div>
    
    <div class="drawer-section" *ngIf="permissions.canAddWidgets">
      <h4>Add Widget</h4>
      <div class="widget-list">
        <button 
          *ngFor="let widgetType of availableWidgets" 
          (click)="addWidget(widgetType)" 
          class="widget-list-item">
          <span class="material-icons">add</span>
          <span class="widget-type-name">{{ widgetType.name }}</span>
        </button>
      </div>
    </div>
  </div>
</div>

<gridster [options]="options">
  <gridster-item [item]="widget" *ngFor="let widget of widgets; let i = index">
    <div class="widget-wrapper">
      <div class="widget-header" *ngIf="permissions.canEditWidgets" [class.locked]="widget.locked">
        <div class="widget-title">
          <span class="drag-icon drag-handle" *ngIf="permissions.canDragWidgets" [class.disabled]="widget.locked">⋮⋮</span>
          <h3>{{ widget.title || 'Widget ' + widget.id }}</h3>
        </div>
        <div class="widget-actions">
          <button 
            *ngIf="permissions.canDragWidgets || permissions.canResizeWidgets"
            class="action-btn lock-btn" 
            (click)="toggleLock(widget)"
            [title]="widget.locked ? 'Unlock' : 'Lock'"
            [class.locked]="widget.locked">
            <span class="material-icons" *ngIf="widget.locked">lock</span>
            <span class="material-icons" *ngIf="!widget.locked">lock_open</span>
          </button>
          <button 
            *ngIf="permissions.canDeleteWidgets"
            class="action-btn delete-btn" 
            (click)="removeWidget(widget.id)"
            title="Delete">
            <span class="material-icons">delete</span>
          </button>
        </div>
      </div>
      <div class="widget-content" [class.no-header]="!permissions.canEditWidgets">
        <!-- Dynamic component container -->
        <ng-container #widgetContainer></ng-container>
      </div>
    </div>
  </gridster-item>
</gridster>
