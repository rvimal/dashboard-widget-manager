<!-- Floating Action Button -->
<button class="fab" (click)="openDrawer()" title="Dashboard Actions">
  <span class="material-icons">chevron_left</span>
</button>

<!-- Drawer Overlay -->
<div class="drawer-overlay" [class.open]="drawerOpen" (click)="closeDrawer()"></div>

<!-- Drawer -->
<div class="drawer" [class.open]="drawerOpen">
  <div class="drawer-header">
    <h3>Dashboard Actions</h3>
    <button class="close-btn" (click)="closeDrawer()" title="Close">
      <span class="material-icons">close</span>
    </button>
  </div>
  
  <div class="drawer-content">
    <div class="drawer-section">
      <h4>Add Widget</h4>
      <div class="widget-list">
        <button 
          *ngFor="let widgetType of availableWidgets" 
          (click)="addWidget(widgetType)" 
          class="widget-list-item">
          <span class="material-icons">add</span>
          <span class="widget-type-name">{{ widgetType.name }}</span>
        </button>
      </div>
    </div>
    
    <div class="drawer-divider"></div>
    
    <div class="drawer-section">
      <h4>Layout Actions</h4>
      <button class="drawer-action-btn" (click)="deleteAllWidgets()">
        <span class="material-icons">delete_sweep</span>
        <span>Delete All Widgets</span>
      </button>
      
      <button class="drawer-action-btn" (click)="saveLayout()">
        <span class="material-icons">save</span>
        <span>Save Layout</span>
      </button>
      
      <button class="drawer-action-btn" (click)="resetLayout()">
        <span class="material-icons">refresh</span>
        <span>Reset Layout</span>
      </button>
    </div>
  </div>
</div>

<gridster [options]="options">
  <gridster-item [item]="widget" *ngFor="let widget of widgets; let i = index">
    <div class="widget-wrapper">
      <div class="widget-header" [class.locked]="widget.locked">
        <div class="widget-title">
          <span class="drag-icon drag-handle" [class.disabled]="widget.locked">⋮⋮</span>
          <h3>{{ widget.title || 'Widget ' + widget.id }}</h3>
        </div>
        <div class="widget-actions">
          <button 
            class="action-btn lock-btn" 
            (click)="toggleLock(widget)"
            [title]="widget.locked ? 'Unlock' : 'Lock'"
            [class.locked]="widget.locked">
            <span class="material-icons" *ngIf="widget.locked">lock</span>
            <span class="material-icons" *ngIf="!widget.locked">lock_open</span>
          </button>
          <button 
            class="action-btn delete-btn" 
            (click)="removeWidget(widget.id)"
            title="Delete">
            <span class="material-icons">delete</span>
          </button>
        </div>
      </div>
      <div class="widget-content">
        <!-- Dynamic component container -->
        <ng-container #widgetContainer></ng-container>
      </div>
    </div>
  </gridster-item>
</gridster>
